name: Probe runners v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-runners-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    name: probe ${{ matrix.label }}
    runs-on: ${{ matrix.label }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        label: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - name: 写入架构信息
        run: |
          mkdir -p .probe
          printf 'label=%s\narch=%s\nsw=%s\n' "${{ matrix.label }}" "$(uname -m)" "$(sw_vers -productVersion)" > ".probe/${{ matrix.label }}.txt"
          cat ".probe/${{ matrix.label }}.txt"
      - name: 提交回仓库
        run: |
          git config user.name probe-bot
          git config user.email probe-bot@users.noreply.github.com
          git add .probe
          git commit -m "probe: ${{ matrix.label }} ($(uname -m))" || exit 0
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            sleep 5
            git pull --rebase --autostash || true
          done
          exit 1
