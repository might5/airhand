name: Build mobile clients

# 移动端两个包：安卓 APK（android/ 里的 Compose 应用）和 iOS 的 ipa，跟桌面端一起构建、产物进同一个 Release。
# 触发条件比桌面端窄：只有移动端目录或核心 crates 变了、以及手动/一键全量时跑，
# 因为两条都要按各自 ABI / SDK 把 Rust 核心交叉编译一遍（LTO + codegen-units=1），很慢。
on:
  # 发布统一走 git tag（见 release.yml，与上游一致）：一个版本对应一个 Release，老产物不会被后续构建覆盖。
  # 本文件只保留手动/被 build-all 调用的入口，产物挂到 CI 临时 tag，不碰正式版本 Release。
  workflow_dispatch:
    inputs:
      server:
        description: "编译进去的默认中转服务器地址（如 relay.example.com:4433，留空则不写）"
        type: string
        required: false
        default: ""
      server_fp:
        description: "服务器证书指纹（64 位十六进制，可带冒号；留空则不写）"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      server:
        description: "编译进去的默认中转服务器地址（如 relay.example.com:4433，留空则不写）"
        type: string
        required: false
        default: ""
      server_fp:
        description: "服务器证书指纹（64 位十六进制，可带冒号；留空则不写）"
        type: string
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AIRHAND_SERVER: ${{ inputs.server }}
      AIRHAND_SERVER_FP: ${{ inputs.server_fp }}
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          uname -m
          nproc
          java -version || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK（Platform 35 + build-tools）和 NDK 27：Gradle 用 cargo-ndk 编 Rust 核心时要 NDK。
      # ubuntu 镜像本来就预装了 SDK + cmdline-tools，直接用自带的那份，不再走 setup-android
      # （那个 action 在预装 SDK 的 runner 上会因为目录属主/已存在的问题失败）。
      - name: Android SDK / NDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$(command -v sdkmanager || true)"
          if [ ! -x "$SM" ]; then
            echo "::error::找不到 sdkmanager（ANDROID_HOME=$SDK）"
            ls -la "$SDK" 2>/dev/null || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$(dirname "$SM")" >> "$GITHUB_PATH"
          echo "sdkmanager: $SM"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_HOME=$SDK"
          ls "$SDK/ndk"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/native

      # cargo-ndk 编译产物按 ABI 生成 libairhand_android.so，缓存一下省得每次 cargo install
      - name: cargo-ndk
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          command -v cargo-ndk || cargo install cargo-ndk --locked
          cargo ndk --version

      - uses: gradle/actions/setup-gradle@v4

      - name: 版本号
        id: ver
        run: |
          VER=$(sed -n 's/^val appVersion *= *"\(.*\)".*/\1/p' android/app/build.gradle.kts | head -1)
          echo "Android 版本号：$VER（versionCode 见 android/app/build.gradle.kts）"
          [ -n "$VER" ] || { echo "没能从 android/app/build.gradle.kts 读到 appVersion"; exit 1; }
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      # 用固定的发布密钥库签名，APK 才能覆盖安装升级而不必卸载（权限授权随 applicationId 保留）。
      # 未配置 secret 时退回调试签名，仍可直接安装，但不能覆盖已用发布密钥签过的版本。
      - name: 导入 Android 签名密钥
        id: keystore
        env:
          AIRHAND_KEYSTORE_B64: ${{ secrets.AIRHAND_KEYSTORE }}
        run: |
          if [ -z "$AIRHAND_KEYSTORE_B64" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 AIRHAND_KEYSTORE，本次 APK 将使用调试签名（不可覆盖安装发布版）"
            exit 0
          fi
          KS="$RUNNER_TEMP/airhand-release.p12"
          # secret 可能是多行 base64，先清掉换行与空白再解码
          printf '%s' "$AIRHAND_KEYSTORE_B64" | tr -d '\r\n \t' | base64 --decode > "$KS"
          SIZE=$(wc -c < "$KS")
          echo "密钥库解码后大小：${SIZE} 字节"
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::AIRHAND_KEYSTORE 解码后仅 ${SIZE} 字节，secret 内容可能损坏（应为一整个 p12 的 base64）"
            exit 1
          fi
          echo "AIRHAND_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          # 该 p12 采用 RC2-40/3DES 旧加密算法：OpenSSL 3 需加载 legacy provider，否则读不出来，
          # 所以先试 -legacy，再退回默认 provider，最后用 keytool 兜底（签名正确性最终由 apksigner 校验）
          KSPASS='${{ secrets.AIRHAND_KEYSTORE_PASSWORD }}'
          if ! openssl pkcs12 -legacy -in "$KS" -passin pass:"$KSPASS" -clcerts -nokeys \
                 -out /dev/null 2>/dev/null; then
            if ! openssl pkcs12 -in "$KS" -passin pass:"$KSPASS" -clcerts -nokeys \
                   -out /dev/null 2>/dev/null; then
              echo "::warning::openssl 无法解析该密钥库（旧算法），改用 keytool 校验"
              keytool -list -v -keystore "$KS" -storetype PKCS12 -storepass "$KSPASS" || {
                echo "::error::密钥库无法用 AIRHAND_KEYSTORE_PASSWORD 打开"
                exit 1
              }
            fi
          fi
          openssl pkcs12 -legacy -in "$KS" -passin pass:"$KSPASS" -nokeys -out /dev/stdout 2>/dev/null \
            | openssl x509 -noout -subject -enddate || true

      - name: 构建 APK
        working-directory: android
        env:
          AIRHAND_KEYSTORE_PASSWORD: ${{ secrets.AIRHAND_KEYSTORE_PASSWORD }}
          AIRHAND_KEY_ALIAS: ${{ secrets.AIRHAND_KEY_ALIAS }}
          AIRHAND_KEY_PASSWORD: ${{ secrets.AIRHAND_KEY_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          if ! ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee android-build.log; then
            echo "::error::Android 构建失败，关键错误如下（完整日志见 artifact android-build-log）"
            grep -nE "^e: |error:|FAILURE:|What went wrong|Caused by|> Task .* FAILED" android-build.log | head -15 | while IFS= read -r l; do echo "::error::${l}"; done
            exit 1
          fi

      - name: 收集产物
        id: apk
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          OUT="Airhand-${{ steps.ver.outputs.ver }}-android.apk"
          cp "$APK" "$OUT"
          ls -lh "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

      - name: 校验 APK 签名
        if: steps.keystore.outputs.enabled == 'true'
        run: |
          APK="${{ steps.apk.outputs.apk }}"
          BT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0/apksigner"
          [ -x "$BT" ] || BT=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner -type f | head -1)
          "$BT" verify --print-certs "$APK"
          # 必须由配置的发布密钥签名，不能退回调试密钥，否则装到手机无法覆盖升级
          "$BT" verify --print-certs "$APK" | grep -q "CN=Airhand Release" || {
            echo "::error::APK 不是用配置的发布密钥签名"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: airhand-android-apk
          path: ${{ steps.apk.outputs.apk }}
          retention-days: 14

      - name: 挂到统一 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/release-upload.sh "${{ steps.ver.outputs.ver }}" "${{ steps.apk.outputs.apk }}"

      - name: 构建日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: |
            android/android-build.log
            android/app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 14

  ios:
    name: iOS ipa (unsigned)
    # 源码用到 iOS 26 才有的 AVFAudio API（allowBluetoothHFP），macOS 15 镜像里的 Xcode 16 没有这个成员，
    # 编译会直接报错，所以固定跑 macOS 26（默认 Xcode 26.6 / iOS 26.6 SDK）。
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ios/native

      # ios/project.yml 用 XcodeGen 生成 Airhand.xcodeproj
      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: 版本号
        id: ver
        run: |
          VER=$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)".*/\1/p' ios/project.yml | head -1)
          echo "iOS 版本号：$VER"
          [ -n "$VER" ] || { echo "没能从 ios/project.yml 读到 MARKETING_VERSION"; exit 1; }
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      # scripts/build-ipa.sh：先 xcodegen generate，再用 build-rust.sh 编真机静态库，最后打包成 ipa。
      # 没有 TEAM_ID（仓库 secret IOS_TEAM_ID）时产出的是 ad-hoc 签名、未正式签名的 ipa，
      # 要用 Sideloadly / AltStore 或自己重新签名才能装到手机上；配了 TEAM_ID 就自动签名并导出。
      - name: 构建 ipa
        working-directory: ios
        env:
          AIRHAND_SERVER: ${{ inputs.server }}
          AIRHAND_SERVER_FP: ${{ inputs.server_fp }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
        run: |
          set -o pipefail
          chmod +x scripts/*.sh
          if ! scripts/build-ipa.sh 2>&1 | tee ios-build.log; then
            echo "::error::iOS 构建失败，关键错误如下（完整日志见 artifact ios-build-log）"
            grep -nE "error:|Error Domain|Failed to|FAILED|Command .* failed|warning: .*deployment target" ios-build.log | head -15 | while IFS= read -r l; do echo "::error::${l}"; done
            exit 1
          fi

      - name: 收集产物
        id: ipa
        run: |
          if [ -f ios/build/export/Airhand.ipa ]; then
            SRC=ios/build/export/Airhand.ipa
            SUFFIX=ios
            SIGNED=1
          else
            SRC=ios/build/Airhand.ipa
            SUFFIX=ios-unsigned
            SIGNED=0
          fi
          [ -f "$SRC" ] || { echo "没找到 ipa：$SRC"; exit 1; }
          OUT="Airhand-${{ steps.ver.outputs.ver }}-$SUFFIX.ipa"
          cp "$SRC" "$OUT"
          ls -lh "$OUT"
          echo "ipa=$OUT" >> "$GITHUB_OUTPUT"
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: airhand-ios-ipa
          path: ${{ steps.ipa.outputs.ipa }}
          retention-days: 14

      - name: 挂到统一 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/release-upload.sh "${{ steps.ver.outputs.ver }}" "${{ steps.ipa.outputs.ipa }}"

      - name: 构建日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios/ios-build.log
          if-no-files-found: ignore
          retention-days: 14
