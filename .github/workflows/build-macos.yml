name: Build macOS client

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build-macos.yml"
  workflow_dispatch:

jobs:
  macos:
    name: macOS dmg (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: 安装前端依赖
        working-directory: client
        run: npm ci

      - name: 构建 dmg
        working-directory: client
        run: npm run tauri build -- --bundles dmg

      - name: 列出构建产物
        working-directory: client/src-tauri/target/release/bundle/dmg
        run: ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: airhand-macos-dmg
          path: client/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
