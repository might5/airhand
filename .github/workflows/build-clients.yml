name: Build desktop clients

# 重试触发：2026-11-25 18:00 修复 Android 签名校验后顺带重跑 macOS dmg
# 重试触发：2026-11-25 18:05 第二次重跑（上次 macOS runner 排队 15 分钟被平台取消）
# 注：macOS arm64 hosted runner 常因容量不足在排队 15 分钟后被取消（job cancelled），
# 遇此情况只需对本文件做任意改动再 push，即可重新触发整套客户端构建。
# 2026-11-24：fork 的 Actions 被停用后重新启用，用本文件改动触发首次构建。
permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build-clients.yml"
  workflow_dispatch:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS dmg (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          uname -m
          sw_vers
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: 安装前端依赖
        working-directory: client
        run: npm ci

      # 用固定的本地代码签名身份签名，避免每次构建 ad-hoc 签名导致 TCC（屏幕录制/辅助功能）
      # 授权因二进制内容哈希变化而失效。证书为自签 Code Signing 证书，经 secret 下发。
      - name: 导入本地代码签名证书
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 APPLE_CERTIFICATE，本次构建将走 ad-hoc 签名"
            exit 0
          fi
          P12="$RUNNER_TEMP/airhand-signing.p12"
          PEM="$RUNNER_TEMP/airhand-signing.pem"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$P12"
          # 自签证书必须加入系统信任域，否则 codesign 只认 ad-hoc、find-identity 报 0 valid
          openssl pkcs12 -in "$P12" -passin pass:"$APPLE_CERTIFICATE_PASSWORD" -clcerts -nokeys -out "$PEM"
          security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "$PEM"
          rm -f "$P12" "$PEM"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          security find-identity -v -p codesigning | head -5

      - name: 构建 dmg
        working-directory: client
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: npm run tauri build -- --bundles dmg

      - name: 校验签名身份
        if: steps.signing.outputs.enabled == 'true'
        working-directory: client/src-tauri/target/release/bundle/macos
        run: |
          APP=$(ls -d *.app | head -1)
          echo "app=$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E "Identifier|Authority|TeamIdentifier|flags"
          codesign -d -r- "$APP" 2>&1 | grep designated
          codesign --verify --strict --verbose=2 "$APP"
          # 身份必须是配置的签名证书，不能退回 ad-hoc
          codesign -dv "$APP" 2>&1 | grep -q "Signature=adhoc" && {
            echo "::error::签名仍为 ad-hoc，证书未生效"; exit 1; } || true

      - name: 列出构建产物
        working-directory: client/src-tauri/target/release/bundle/dmg
        run: ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: airhand-macos-dmg
          path: client/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: 挂到统一 Release（免登录下载）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 所有平台的产物共用一个 Release，tag 固定为 v<版本号>，见 .github/scripts/release-upload.sh
          VER=$(node -p "require('./client/src-tauri/tauri.conf.json').version")
          bash .github/scripts/release-upload.sh "$VER" client/src-tauri/target/release/bundle/dmg/*.dmg

  windows:
    name: Windows 安装包 (x64)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        shell: bash
        run: |
          systeminfo | head -5 || true
          rustc -Vv || true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: 安装前端依赖
        working-directory: client
        shell: bash
        run: npm ci

      - name: 构建 nsis 安装包
        working-directory: client
        shell: bash
        run: npm run tauri build -- --bundles nsis

      - name: 列出构建产物
        working-directory: client/src-tauri/target/release/bundle/nsis
        shell: bash
        run: ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: airhand-windows-nsis
          path: client/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: 挂到统一 Release（免登录下载）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 所有平台的产物共用一个 Release，tag 固定为 v<版本号>，见 .github/scripts/release-upload.sh
          VER=$(node -p "require('./client/src-tauri/tauri.conf.json').version")
          bash .github/scripts/release-upload.sh "$VER" client/src-tauri/target/release/bundle/nsis/*.exe
