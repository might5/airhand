name: Build desktop clients

# 重试触发：2026-11-25 18:00 修复 Android 签名校验后顺带重跑 macOS dmg
# 重试触发：2026-11-25 18:05 第二次重跑（上次 macOS runner 排队 15 分钟被平台取消）
# 注：macOS arm64 hosted runner 常因容量不足在排队 15 分钟后被取消（job cancelled），
# 遇此情况只需对本文件做任意改动再 push，即可重新触发整套客户端构建。
# 2026-11-24：fork 的 Actions 被停用后重新启用，用本文件改动触发首次构建。
permissions:
  contents: write

on:
  # 发布统一走 git tag（见 release.yml，与上游一致）：一个版本对应一个 Release，老产物不会被后续构建覆盖。
  # 本文件只保留手动/被 build-all 调用的入口，产物挂到 CI 临时 tag，不碰正式版本 Release。
  workflow_dispatch:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS dmg (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          uname -m
          sw_vers
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: 安装前端依赖
        working-directory: client
        run: npm ci

      # 用固定的本地代码签名身份签名，避免每次构建 ad-hoc 签名导致 TCC（屏幕录制/辅助功能）
      # 授权因二进制内容哈希变化而失效。证书为自签 Code Signing 证书，经 secret 下发。
      - name: 导入本地代码签名证书
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 APPLE_CERTIFICATE，本次构建将走 ad-hoc 签名"
            exit 0
          fi
          KC="$RUNNER_TEMP/airhand-signing.keychain-db"
          KCPASS="$(openssl rand -hex 16)"
          P12="$RUNNER_TEMP/airhand-signing.p12"
          PEM="$RUNNER_TEMP/airhand-signing.pem"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$P12"
          # 私钥必须真正 import 进钥匙串：只 add-trusted-cert 只留下证书，
          # 构建时会报 failed to codesign application: failed to resolve signing identity
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$P12" -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -A
          # 自签证书必须加入系统信任域，否则 find-identity 看不到它、Tauri 会退回 ad-hoc；
          # 写 System.keychain 需要 root，非 sudo 会报 SecCertificateAddToKeychain: Write permissions error
          openssl pkcs12 -in "$P12" -passin pass:"$APPLE_CERTIFICATE_PASSWORD" -clcerts -nokeys -out "$PEM"
          sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "$PEM"
          # 免交互授权 + 把临时钥匙串并入搜索列表，后续 step 才能找到该身份
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC"
          EXISTING=$(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//' | tr '\n' ' ')
          security list-keychains -d user -s "$KC" $EXISTING
          echo "KEYCHAIN_PASS=$KCPASS" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KC" >> "$GITHUB_ENV"
          rm -f "$P12" "$PEM"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          security find-identity -v -p codesigning

      - name: 构建 dmg
        working-directory: client
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          # 保险：确保签名钥匙串处于解锁状态，避免 codesign 拿不到私钥
          if [ -n "$KEYCHAIN_PASS" ]; then
            security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          fi
          npm run tauri build -- --bundles dmg

      - name: 校验签名身份
        if: steps.signing.outputs.enabled == 'true'
        working-directory: client/src-tauri/target/release/bundle/macos
        run: |
          APP=$(ls -d *.app | head -1)
          echo "app=$APP"
          SIG=$(codesign -dv --verbose=4 "$APP" 2>&1 || true)
          echo "$SIG" | grep -E "Identifier|Authority|TeamIdentifier|flags" || true
          codesign -d -r- "$APP" 2>&1 | grep designated || true
          codesign --verify --strict --verbose=2 "$APP"
          # 不能用 codesign ... | grep -q：grep 命中即退出会让 codesign 收到 SIGPIPE 被误判
          IDENTITY="${{ secrets.APPLE_SIGNING_IDENTITY }}"
          case "$SIG" in
            *"Signature=adhoc"*)
              echo "::error::产物仍是 ad-hoc 签名，证书未生效"; exit 1;;
          esac
          case "$SIG" in
            *"Authority=$IDENTITY"*)
              echo "签名身份校验通过";;
            *)
              echo "::error::签名身份不是预期证书"; exit 1;;
          esac

      - name: 列出构建产物
        working-directory: client/src-tauri/target/release/bundle/dmg
        run: ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: airhand-macos-dmg
          path: client/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: 挂到统一 Release（免登录下载）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 所有平台的产物共用一个 Release，tag 固定为 v<版本号>，见 .github/scripts/release-upload.sh
          VER=$(node -p "require('./client/src-tauri/tauri.conf.json').version")
          bash .github/scripts/release-upload.sh "$VER" client/src-tauri/target/release/bundle/dmg/*.dmg

  windows:
    name: Windows 安装包 (x64)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        shell: bash
        run: |
          systeminfo | head -5 || true
          rustc -Vv || true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: 安装前端依赖
        working-directory: client
        shell: bash
        run: npm ci

      - name: 构建 nsis 安装包
        working-directory: client
        shell: bash
        run: npm run tauri build -- --bundles nsis

      - name: 列出构建产物
        working-directory: client/src-tauri/target/release/bundle/nsis
        shell: bash
        run: ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: airhand-windows-nsis
          path: client/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: 挂到统一 Release（免登录下载）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 所有平台的产物共用一个 Release，tag 固定为 v<版本号>，见 .github/scripts/release-upload.sh
          VER=$(node -p "require('./client/src-tauri/tauri.conf.json').version")
          bash .github/scripts/release-upload.sh "$VER" client/src-tauri/target/release/bundle/nsis/*.exe
