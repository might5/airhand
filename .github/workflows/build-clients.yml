name: Build desktop clients

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build-clients.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS dmg (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          uname -m
          sw_vers
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: 安装前端依赖
        working-directory: client
        run: npm ci

      - name: 构建 dmg
        working-directory: client
        run: npm run tauri build -- --bundles dmg

      - name: 列出构建产物
        working-directory: client/src-tauri/target/release/bundle/dmg
        run: ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: airhand-macos-dmg
          path: client/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: 发布到 Release（免登录下载）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # tag 带上版本号，免得同一个 build-N 里混着好几个版本的安装包（旧的 build-4 就是这样）
          VER=$(node -p "require('./client/src-tauri/tauri.conf.json').version")
          TAG="v$VER-build-${{ github.run_number }}"
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "${{ github.repository }}" \
                 --latest \
                 --title "Airhand $VER ($TAG)" \
                 --notes "自动构建：macOS arm64 + Windows x64，commit ${GITHUB_SHA::7}。未签名（ad-hoc），macOS 首次打开请右键→打开。" \
            || true
          gh release upload "$TAG" client/src-tauri/target/release/bundle/dmg/*.dmg \
            --clobber --repo "${{ github.repository }}"
          gh release view "$TAG" --repo "${{ github.repository }}" --json url -q .url

  windows:
    name: Windows 安装包 (x64)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        shell: bash
        run: |
          systeminfo | head -5 || true
          rustc -Vv || true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: 安装前端依赖
        working-directory: client
        shell: bash
        run: npm ci

      - name: 构建 nsis 安装包
        working-directory: client
        shell: bash
        run: npm run tauri build -- --bundles nsis

      - name: 列出构建产物
        working-directory: client/src-tauri/target/release/bundle/nsis
        shell: bash
        run: ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: airhand-windows-nsis
          path: client/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: 发布到 Release（免登录下载）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # tag 带上版本号，免得同一个 build-N 里混着好几个版本的安装包（旧的 build-4 就是这样）
          VER=$(node -p "require('./client/src-tauri/tauri.conf.json').version")
          TAG="v$VER-build-${{ github.run_number }}"
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "${{ github.repository }}" \
                 --latest \
                 --title "Airhand $VER ($TAG)" \
                 --notes "自动构建：macOS arm64 + Windows x64，commit ${GITHUB_SHA::7}。未签名（ad-hoc），macOS 首次打开请右键→打开。" \
            || true
          gh release upload "$TAG" client/src-tauri/target/release/bundle/nsis/*.exe \
            --clobber --repo "${{ github.repository }}"
          gh release view "$TAG" --repo "${{ github.repository }}" --json url -q .url
