name: Probe runners

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-runners.yml"
  workflow_dispatch:

jobs:
  probe:
    name: probe ${{ matrix.label }}
    runs-on: ${{ matrix.label }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        label: [macos-15-intel, macos-15, macos-13]
    steps:
      - name: 汇报架构
        run: |
          uname -m
          sw_vers
          echo "runner=${{ matrix.label }} arch=$(uname -m)"
